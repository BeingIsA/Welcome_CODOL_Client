name: 发布 Windows 客户端

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    outputs:
      base_version: ${{ steps.version.outputs.base_version }}
      archive_size: ${{ steps.archive.outputs.size }}
      archive_sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          architecture: x64

      - name: 读取客户端发行版本
        id: version
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          $baseVersion = python -c "from codol_rebuild import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0 -or $baseVersion -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "客户端发行版本应为三个不带前导零的整数，例如 0.1.0"
          }
          "base_version=$baseVersion" >> $env:GITHUB_OUTPUT

      - name: 安装构建依赖
        run: python -m pip install -r requirements-build.txt

      - name: 验证启动参数、发行目录和 Windows 权限
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -B -X utf8 -m unittest -v tests.test_host_launch_cli tests.test_host_release tests.test_runtime_cache tests.test_updater

      - name: 编译并运行 EXE 启动预检
        run: python -B -X utf8 tools/build_host.py --output "$env:RUNNER_TEMP/CODOL-Windows-x64"

      - name: 编译更新启动器
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m nuitka --mode=onefile --enable-plugin=tk-inter --msvc=latest --assume-yes-for-downloads --windows-console-mode=disable --windows-icon-from-exe=bin/v1649370/codol1649370-offline.exe --output-filename=CODOLLauncher.exe --output-dir="$env:RUNNER_TEMP/launcher-build" tools/launch_updater.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:RUNNER_TEMP/launcher-build/CODOLLauncher.exe" "$env:RUNNER_TEMP/CODOLLauncher.exe"
          Copy-Item "$env:RUNNER_TEMP/launcher-build/CODOLLauncher.exe" "$env:RUNNER_TEMP/CODOL-Windows-x64/"
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/CODOL-Windows-x64/release-commit.txt", $env:GITHUB_SHA)

      - name: 生成程序 ZIP 和 SHA-256
        id: archive
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'CODOL-Windows-x64'
          foreach ($directory in 'resources', 'workspaces', 'src', 'tests') {
            if (Test-Path -LiteralPath (Join-Path $package $directory)) {
              throw "发行目录含有 $directory"
            }
          }
          $archive = "$package.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory($package, $archive)
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "size=$((Get-Item $archive).Length)" >> $env:GITHUB_OUTPUT
          "sha256=$digest" >> $env:GITHUB_OUTPUT
          [System.IO.File]::WriteAllText("$archive.sha256", "$digest  CODOL-Windows-x64.zip`n")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: |
            ${{ runner.temp }}/CODOLLauncher.exe
            ${{ runner.temp }}/CODOL-Windows-x64.zip
            ${{ runner.temp }}/CODOL-Windows-x64.zip.sha256
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  reserve_version:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.reserve.outputs.tag }}
    concurrency:
      group: codol-client-version
      queue: max
    steps:
      - name: 预留本次提交的版本号
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_VERSION: ${{ needs.build.outputs.base_version }}
        shell: bash
        run: |
          tag_prefix="v${BASE_VERSION%.*}."
          next_patch=${BASE_VERSION##*.}
          tag=""
          # 发布步骤用轻量标签记录提交与版本的对应关系，失败重跑时可找回原版本。
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/$tag_prefix" \
            --jq '.[] | [.ref, .object.sha, .object.type] | @tsv' > "$RUNNER_TEMP/version-refs.tsv"
          while IFS=$'\t' read -r tag_ref target object_type; do
            patch_number=${tag_ref#"refs/tags/$tag_prefix"}
            [[ "$patch_number" =~ ^(0|[1-9][0-9]*)$ ]] || continue
            if [[ "$object_type" == tag ]]; then
              target=$(gh api "repos/$GH_REPO/commits/${tag_ref#refs/tags/}" --jq .sha)
            fi
            if [[ "$target" == "$GITHUB_SHA" ]]; then
              tag=${tag_ref#refs/tags/}
            fi
            if (( patch_number >= next_patch )); then
              next_patch=$((patch_number + 1))
            fi
          done < "$RUNNER_TEMP/version-refs.tsv"
          tag=${tag:-"$tag_prefix$next_patch"}
          state=$(gh api graphql -f owner="$GITHUB_REPOSITORY_OWNER" -f name="${GH_REPO#*/}" \
            -f tag="$tag" -f ref="refs/tags/$tag" -f query='
              query($owner: String!, $name: String!, $tag: String!, $ref: String!) {
                repository(owner: $owner, name: $name) {
                  ref(qualifiedName: $ref) { name }
                  release(tagName: $tag) { isDraft }
                }
              }' --jq '.data.repository')
          if jq -e '.ref != null' <<< "$state" > /dev/null; then
            tag_commit=$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::已有标签 $tag 指向其他提交"
              exit 1
            fi
          fi
          if jq -e '.release.isDraft == true and .ref == null' <<< "$state" > /dev/null; then
            draft_target=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)
            if [[ "$draft_target" != "$GITHUB_SHA" ]]; then
              echo "::error::已有草稿 $tag 使用了其他发布目标"
              exit 1
            fi
          fi
          if jq -e '.ref == null' <<< "$state" > /dev/null; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" --silent
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: reserve_version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: codol-client-publish
      queue: max
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: assets

      - name: 校验下载的程序包
        working-directory: assets
        run: sha256sum --check CODOL-Windows-x64.zip.sha256

      - name: 发布 GitHub Release
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          tag: ${{ needs.reserve_version.outputs.tag }}
        shell: bash
        run: |
          state=$(gh api graphql -f owner="$GITHUB_REPOSITORY_OWNER" -f name="${GH_REPO#*/}" \
            -f tag="$tag" -f query='
              query($owner: String!, $name: String!, $tag: String!) {
                repository(owner: $owner, name: $name) {
                  release(tagName: $tag) { isDraft }
                  latestRelease { tagName }
                }
              }' --jq '.data.repository')
          if jq -e '.release.isDraft == false' <<< "$state" > /dev/null; then
            echo "$tag 已发布"
            exit 0
          fi
          if jq -e '.release == null' <<< "$state" > /dev/null; then
            gh release create "$tag" --draft --verify-tag --target "$GITHUB_SHA" --title "CODOL $tag · Windows x64" \
              --notes ""
          fi
          gh release upload "$tag" CODOLLauncher.exe CODOL-Windows-x64.zip CODOL-Windows-x64.zip.sha256 --clobber
          latest_tag=$(jq -r '.latestRelease.tagName // empty' <<< "$state")
          make_latest=true
          if [[ -n "$latest_tag" && "$latest_tag" != "$tag" ]]; then
            relationship=$(gh api "repos/$GH_REPO/compare/$latest_tag...$GITHUB_SHA" --jq .status)
            if [[ "$relationship" == behind ]]; then
              make_latest=false
            elif [[ "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && \
                 [[ "$(printf '%s\n' "$latest_tag" "$tag" | sort -V | tail -1)" != "$tag" ]]; then
              make_latest=false
            fi
          fi
          gh release edit "$tag" --target "$GITHUB_SHA" --draft=false --latest="$make_latest"

  publish_r2:
    needs: reserve_version
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: assets

      - name: 校验下载的程序包
        working-directory: assets
        run: sha256sum --check CODOL-Windows-x64.zip.sha256

      - name: 上传版本文件到 Cloudflare R2
        working-directory: assets
        env:
          RELEASE_TAG: ${{ needs.reserve_version.outputs.tag }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        shell: bash
        run: |
          : "${R2_BUCKET:?缺少 R2_BUCKET}" "${R2_ENDPOINT:?缺少 R2_ENDPOINT}"
          : "${AWS_ACCESS_KEY_ID:?缺少 R2_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY:?缺少 R2_SECRET_ACCESS_KEY}"
          destination="s3://$R2_BUCKET/releases/$RELEASE_TAG"
          aws s3 cp CODOL-Windows-x64.zip "$destination/CODOL-Windows-x64.zip" --endpoint-url "$R2_ENDPOINT" --only-show-errors

  update_manifest:
    needs: [build, reserve_version, publish, publish_r2]
    runs-on: ubuntu-latest
    concurrency:
      group: codol-update-manifest
      queue: max
    steps:
      - name: 发布最新版本清单
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.reserve_version.outputs.tag }}
          SIZE: ${{ needs.build.outputs.archive_size }}
          DIGEST: ${{ needs.build.outputs.archive_sha256 }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        shell: bash
        run: |
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          [[ "$latest" == "$RELEASE_TAG" ]] || exit 0
          jq -n --arg commit "$GITHUB_SHA" --arg version "$RELEASE_TAG" --arg sha256 "$DIGEST" --argjson size "$SIZE" '{commit:$commit,version:$version,sha256:$sha256,size:$size,path:("releases/"+$version+"/CODOL-Windows-x64.zip")}' > latest.json
          aws s3 cp latest.json "s3://$R2_BUCKET/releases/latest.json" --endpoint-url "$R2_ENDPOINT" --content-type application/json --cache-control no-store
